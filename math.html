<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equation Editor</title>

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5628266432213997" crossorigin="anonymous"></script>
    
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- CodeCogs Editor -->
  <link rel="stylesheet" href="https://editor.codecogs.com/eqneditor.css"/>
  <script src="https://editor.codecogs.com/eqneditor.api.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['"Crimson Pro"', 'Georgia', 'serif'],
            body: ['"Source Sans 3"', 'system-ui', 'sans-serif'],
          },
        }
      }
    }

    window.onload = function () {
      textarea = EqEditor.TextArea.link('latexInput')
        .addOutput(new EqEditor.Output('output'))
        .addHistoryMenu(new EqEditor.History('history'));
      EqEditor.Toolbar.link('toolbar').addTextArea(textarea);
    }
  </script>

  <style>
    html {
      zoom: 1.5;
    }
    /* CodeCogs override: match our clean theme */
    #history select {
      background-color: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 0.5rem;
      padding: 0.375rem 0.75rem;
      font-family: 'Source Sans 3', sans-serif;
      font-size: 0.875rem;
      color: #334155;
      width: 100%;
      margin-bottom: 0.5rem;
    }

    #history select:focus {
      outline: none;
      border-color: #94a3b8;
      box-shadow: 0 0 0 3px rgba(148, 163, 184, 0.15);
    }

    #toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem;
      margin-bottom: 0.75rem;
    }

    #toolbar button,
    #toolbar .button {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 0.375rem;
      padding: 0.375rem 0.5rem;
      cursor: pointer;
      font-size: 0.875rem;
      line-height: 1;
      color: #475569;
      transition: all 0.15s ease;
    }

    #toolbar button:hover,
    #toolbar .button:hover {
      background-color: #f1f5f9;
      border-color: #cbd5e1;
      color: #1e293b;
    }

    #toolbar .group {
      display: flex;
      gap: 0.125rem;
      margin-right: 0.25rem;
    }

    #latexInput {
      width: 100%;
      min-height: 140px;
      padding: 1rem;
      border: 1px solid #e2e8f0;
      border-radius: 0.5rem;
      font-family: 'Source Sans 3', 'Consolas', 'Monaco', monospace;
      font-size: 0.9375rem;
      line-height: 1.6;
      color: #1e293b;
      background-color: #fff;
      resize: vertical;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    #latexInput:focus {
      border-color: #94a3b8;
      box-shadow: 0 0 0 3px rgba(148, 163, 184, 0.15);
    }

    #latexInput::placeholder {
      color: #94a3b8;
    }

    #output {
      max-width: 100%;
      height: auto;
    }

    /* Preview area override */
    #equation-output {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 160px;
      padding: 2rem;
    }
  </style>
</head>
<body class="bg-slate-50 font-body text-slate-700 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-3xl mx-auto px-6 py-10 text-center">
      <h1 class="font-display text-4xl md:text-5xl font-bold text-slate-900 tracking-tight">
        Equation Editor
      </h1>
      <p class="mt-3 text-lg text-slate-500 font-light">
        Compose beautiful mathematical expressions with ease
      </p>
    </div>
  </header>

  <!-- Top AdSense Banner -->
  <div class="bg-white border-b border-slate-200">
    <div class="max-w-3xl mx-auto px-6 py-4">
      <!-- Google AdSense: Top Banner -->
      <div class="h-[90px] w-full bg-slate-100 rounded-lg border border-dashed border-slate-300 flex items-center justify-center">
        <span class="text-sm text-slate-400 font-medium">AdSense Banner (728x90)</span>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <main class="flex-1 px-6 py-10">
    <div class="max-w-3xl mx-auto">

      <!-- Editor Card -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">

        <!-- Toolbar + History Section -->
        <div class="border-b border-slate-100 px-6 pt-5 pb-1">
          <div id="history"></div>
          <div id="toolbar"></div>
        </div>

        <!-- LaTeX Input -->
        <div class="px-6 py-5">
          <label for="latexInput" class="block text-sm font-semibold text-slate-600 mb-2 uppercase tracking-wider text-xs">
            LaTeX Input
          </label>
          <div id="latexInput" placeholder="Write Equation here..."></div>
        </div>

        <!-- Equation Output Preview -->
        <div class="border-t border-slate-100 bg-slate-50/60">
          <div class="px-6 py-4">
            <span class="block text-sm font-semibold text-slate-600 uppercase tracking-wider text-xs mb-3">
              Preview
            </span>
            <div id="equation-output" class="bg-white rounded-xl border border-slate-200 shadow-sm">
              <img id="output" alt="Equation preview">
            </div>
          </div>
        </div>

      </div>

      <!-- Bottom AdSense Banner -->
      <div class="mt-8">
        <!-- Google AdSense: Bottom Banner -->
        <div class="h-[90px] w-full bg-white rounded-xl border border-dashed border-slate-300 flex items-center justify-center shadow-sm">
          <span class="text-sm text-slate-400 font-medium">AdSense Banner (728x90)</span>
        </div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-slate-200 mt-auto">
    <div class="max-w-3xl mx-auto px-6 py-8 text-center">
      <p class="text-sm text-slate-400">
        made by Chakkrit Termritthikun
      </p>
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

</body>
</html>
