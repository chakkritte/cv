<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zen Breathe - Pro</title>
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #ffffff;
            --circle-color: #00e5ff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* จัดให้อยู่ตรงกลางหน้าจอ */
            gap: 60px; /* ระยะห่างระหว่างวงกลมกับปุ่ม (ปรับให้ปุ่มสูงขึ้น) */
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* วงกลมหลัก */
        .breathe-circle {
            width: 160px;
            height: 160px;
            background: radial-gradient(circle, rgba(0,229,255,0.15) 0%, rgba(0,229,255,0) 70%);
            border: 2px solid rgba(0, 229, 255, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.1);
            transition: transform 4s ease-in-out, box-shadow 4s ease-in-out, border-color 4s ease-in-out, background 4s ease-in-out;
            position: relative;
        }

        .instruction-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .instruction-text {
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-align: center;
            opacity: 0.9;
        }

        .timer-text {
            font-size: 2.5rem;
            font-weight: 200;
            opacity: 0; /* ซ่อนไว้ก่อนตอนเริ่ม */
            transition: opacity 0.5s ease;
        }

        /* State: หายใจเข้า */
        .inhale {
            transform: scale(1.8);
            box-shadow: 0 0 80px rgba(0, 229, 255, 0.6);
            border-color: rgba(0, 229, 255, 1);
            background: radial-gradient(circle, rgba(0,229,255,0.25) 0%, rgba(0,229,255,0) 70%);
        }

        /* State: หายใจออก */
        .exhale {
            transform: scale(1);
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.1);
            border-color: rgba(0, 229, 255, 0.3);
            background: radial-gradient(circle, rgba(0,229,255,0.1) 0%, rgba(0,229,255,0) 70%);
        }

        button {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 14px 40px;
            font-size: 1.1rem;
            border-radius: 40px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        button:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="breathe-circle" id="circle">
        <div class="instruction-container">
            <div class="instruction-text" id="text">พร้อมไหม?</div>
            <div class="timer-text" id="timer">4</div>
        </div>
    </div>

    <button id="startBtn">เริ่มฝึกหายใจ</button>

    <script>
        const circle = document.getElementById('circle');
        const text = document.getElementById('text');
        const timerText = document.getElementById('timer');
        const startBtn = document.getElementById('startBtn');

        let isBreathing = false;
        let timerInterval;
        let timeLeft = 4;
        let currentPhase = 'idle'; // 'inhale' หรือ 'exhale'

        // Web Audio API
        let audioCtx;
        let oscillator;
        let gainNode;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                
                // เสียงคลื่นความถี่ต่ำ (Ambient Sound)
                oscillator = audioCtx.createOscillator();
                gainNode = audioCtx.createGain();
                oscillator.type = 'sine';
                oscillator.frequency.value = 174; 
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                gainNode.gain.value = 0; 
                oscillator.start();
            }
            if(audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // ฟังก์ชันสร้างเสียง "ติ๊ก" เบาๆ กำกับจังหวะวินาที
        function playTickSound() {
            if (!audioCtx) return;
            const tickOsc = audioCtx.createOscillator();
            const tickGain = audioCtx.createGain();
            
            tickOsc.connect(tickGain);
            tickGain.connect(audioCtx.destination);
            
            tickOsc.type = 'sine';
            tickOsc.frequency.setValueAtTime(600, audioCtx.currentTime); // เสียงใสๆ
            
            // ตั้งค่าความดังให้ดังนิดนึงแล้วหายไปอย่างรวดเร็ว (Pop/Tick effect)
            tickGain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            tickGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            
            tickOsc.start(audioCtx.currentTime);
            tickOsc.stop(audioCtx.currentTime + 0.1);
        }

        function playInhaleAmbient() {
            if (!audioCtx) return;
            gainNode.gain.setTargetAtTime(0.25, audioCtx.currentTime, 1.5);
            oscillator.frequency.setTargetAtTime(184, audioCtx.currentTime, 2);
        }

        function playExhaleAmbient() {
            if (!audioCtx) return;
            gainNode.gain.setTargetAtTime(0.05, audioCtx.currentTime, 1.5);
            oscillator.frequency.setTargetAtTime(174, audioCtx.currentTime, 2);
        }

        function stopAudio() {
            if (audioCtx && gainNode) {
                gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.5);
            }
        }

        function switchPhase() {
            if (!isBreathing) return;

            if (currentPhase === 'inhale') {
                currentPhase = 'exhale';
                text.innerText = 'หายใจออก...';
                circle.className = 'breathe-circle exhale';
                playExhaleAmbient();
            } else {
                currentPhase = 'inhale';
                text.innerText = 'หายใจเข้า...';
                circle.className = 'breathe-circle inhale';
                playInhaleAmbient();
            }
        }

        function timerLoop() {
            if (!isBreathing) return;

            // แสดงตัวเลขและเล่นเสียงติ๊ก
            timerText.innerText = timeLeft;
            playTickSound();

            timeLeft--;

            // เมื่อนับถึง 0 ให้สลับจังหวะหายใจและรีเซ็ตเวลา
            if (timeLeft < 0) {
                timeLeft = 3; // รีเซ็ตเป็น 3 เพราะมันจะแสดง 4 ในลูปถัดไปทันที
                switchPhase();
                timerText.innerText = 4;
                playTickSound();
            }
        }

        function toggleBreathe() {
            if (isBreathing) {
                // หยุดการทำงาน
                isBreathing = false;
                clearInterval(timerInterval);
                circle.className = 'breathe-circle';
                text.innerText = 'พร้อมไหม?';
                timerText.style.opacity = '0'; // ซ่อนตัวเลข
                startBtn.innerText = 'เริ่มฝึกหายใจ';
                currentPhase = 'idle';
                stopAudio();
            } else {
                // เริ่มการทำงาน
                initAudio(); 
                isBreathing = true;
                startBtn.innerText = 'หยุด';
                timerText.style.opacity = '1'; // แสดงตัวเลข
                
                // ตั้งค่าเริ่มต้นรอบแรก
                currentPhase = 'exhale'; // ตั้งหลอกไว้เพื่อให้ switchPhase เปลี่ยนเป็น inhale
                timeLeft = 4;
                switchPhase(); // สลับเป็น 'หายใจเข้า' รอบแรก
                
                // เรียกครั้งแรกทันที
                timerText.innerText = timeLeft;
                playTickSound();
                timeLeft--;

                // จับเวลาทุกๆ 1 วินาที
                timerInterval = setInterval(timerLoop, 1000);
            }
        }

        startBtn.addEventListener('click', toggleBreathe);
    </script>
</body>
</html>
